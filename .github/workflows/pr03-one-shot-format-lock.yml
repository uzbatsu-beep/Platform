name: PR-03 one-shot lockfile and rustfmt repair

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: neon-pr03-one-shot
  cancel-in-progress: true

jobs:
  format-and-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'pr/03-db-layer-module-registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - name: Generate genuine Cargo.lock
        run: cargo generate-lockfile
      - name: Apply rustfmt to workspace
        run: cargo fmt --all
      - name: Remove one-shot privileged workflow and commit changes to PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/pr03-one-shot-format-lock.yml
          git add Cargo.lock crates/platform-core crates/platform-db-pg crates/platform-db-sqlite
          git diff --cached --check
          git commit -m "chore(pr-03): normalize rustfmt and refresh Cargo.lock; remove temporary writer"
          git push origin HEAD:pr/03-db-layer-module-registry
