name: PR-03 one-shot rustfmt finalization

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: neon-pr03-one-shot-rustfmt-final
  cancel-in-progress: true

jobs:
  rustfmt-and-remove-writer:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'pr/03-db-layer-module-registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - run: cargo fmt --all
      - name: Remove this workflow and push formatted code to PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/pr03-one-shot-rustfmt-final.yml
          git add crates/platform-core crates/platform-db-pg crates/platform-db-sqlite
          git diff --cached --check
          git commit -m "style(pr-03): rustfmt transactional migration hardening; remove one-shot writer"
          git push origin HEAD:pr/03-db-layer-module-registry
