name: Refresh Cargo lockfile (PR-01 temporary)

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh-cargo-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'pr/01-workspace-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
      - run: cargo generate-lockfile
      - name: Commit regenerated Cargo.lock into PR branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock remains unchanged"
          else
            git commit -m "chore(pr-01): refresh lockfile after dependency cleanup"
            git push origin HEAD:pr/01-workspace-bootstrap
          fi
