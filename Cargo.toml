[workspace]
resolver = "2"
members = [
    "crates/platform-sdk",
    "crates/platform-core",
    "crates/platform-db-pg",
    "crates/platform-db-sqlite",
    "crates/platform-cli-core",
    "crates/platform-cli",
    "crates/platform-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"
authors = ["NEON Engineering Team"]
publish = false

[workspace.dependencies]
# Internal crates
platform-sdk = { path = "crates/platform-sdk", version = "=0.1.0" }
platform-core = { path = "crates/platform-core", version = "=0.1.0" }
platform-db-pg = { path = "crates/platform-db-pg", version = "=0.1.0" }
platform-db-sqlite = { path = "crates/platform-db-sqlite", version = "=0.1.0" }
platform-cli-core = { path = "crates/platform-cli-core", version = "=0.1.0" }

# Core runtime & web
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "matched-path", "query", "tokio"] }
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["limit", "request-id", "set-header", "trace", "util"] }

# Data & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.16", features = ["serde", "v7"] }
semver = { version = "1.0", features = ["serde"] }
thiserror = "2.0"

# Identity & Cryptography (PR-04: vetted RustCrypto Argon2id + OS CSPRNG + cross-platform no-echo CLI)
argon2 = { version = "0.5.3", features = ["password-hash", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7.5.5"

# Database (explicitly separated adapters; pinned bundled SQLite 3.54.1 fixing RUSTSEC-2026-0459; no bundled-sqlcipher)
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "uuid", "json", "migrate"] }
libsqlite3-sys = { version = "=0.39.1", features = ["bundled"] }

# OpenAPI & Observability
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
