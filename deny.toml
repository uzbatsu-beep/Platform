# cargo-deny configuration (v2 schema — EmbarkStudios/cargo-deny >= 0.16)
# Note: removed v1 fields (`vulnerability`, `notice`, `unmaintained = "warn"`, `severity-threshold`) are omitted.

[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

# Mozilla CA root certificate data in webpki-roots is under CDLA-Permissive-2.0.
# Scope the exception to this specific dependency rather than broadening all licenses.
exceptions = [{ allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
